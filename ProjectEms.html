<!DOCTYPE html>
<html>
<head>
  <title>EMS Ultimate 2.0</title>
  <link rel="stylesheet" href="ProjectEms.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
  <h2>⚡ EMS</h2>
  <ul>
    <li>Dashboard</li>
    <li>Kiln</li>
    <li>Cement</li>
    <li>Coal</li>
    <li>Packing</li>
  </ul>
</div>

<div class="main">

<h1>Energy Analytics Dashboard</h1>

<div class="top-cards">
  <div class="kpi">⚡ <span id="totalEnergy"></span></div>
  <div class="kpi">🔥 Efficiency: 92%</div>
  <div class="kpi">💡 Load: 78%</div>
</div>

<div class="charts">
  <canvas id="mainChart"></canvas>
  <canvas id="drillChart"></canvas>
</div>

<div class="bottom">
  <div class="circle">Kiln<br>32%</div>
  <div class="circle">Cement<br>29%</div>
  <div class="circle">Coal<br>8%</div>
  <div class="circle">Packing<br>6%</div>
</div>

</div>

<script src="ProjectEms.js"></script>

</body>
</html>
